paths:
  /api/mocks/mockingpets:
    get:
      summary: Genera mascotas ficticias
      tags:
        - Mocks
      description: Genera 100 mascotas ficticias con formato MongoDB
      responses:
        "200":
          description: Mascotas ficticias generadas correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          description: ID único de la mascota
                        name:
                          type: string
                          description: Nombre de la mascota
                        specie:
                          type: string
                          description: Especie de la mascota
                        birthDate:
                          type: string
                          format: date
                          description: Fecha de nacimiento
                        adopted:
                          type: boolean
                          description: Estado de adopción
                        owner:
                          type: string
                          description: ID del propietario
                        image:
                          type: string
                          description: Ruta de la imagen
        "500":
          description: Error interno del servidor

  /api/mocks/mockingusers:
    get:
      summary: Genera usuarios ficticios
      tags:
        - Mocks
      description: Genera 50 usuarios ficticios con contraseña encriptada y formato MongoDB
      responses:
        "200":
          description: Usuarios ficticios generados correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          description: ID único del usuario
                        first_name:
                          type: string
                          description: Nombre del usuario
                        last_name:
                          type: string
                          description: Apellido del usuario
                        email:
                          type: string
                          format: email
                          description: Email del usuario
                        password:
                          type: string
                          description: Contraseña encriptada
                        role:
                          type: string
                          enum: [user, admin]
                          description: Rol del usuario
                        pets:
                          type: array
                          items:
                            type: string
                          description: Array de IDs de mascotas
        "500":
          description: Error interno del servidor

  /api/mocks/generateData:
    post:
      summary: Genera e inserta datos ficticios en la base de datos
      tags:
        - Mocks
      description: Recibe parámetros numéricos para generar usuarios y mascotas, y los inserta en la base de datos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                users:
                  type: integer
                  description: Número de usuarios a generar e insertar
                  minimum: 0
                  default: 0
                pets:
                  type: integer
                  description: Número de mascotas a generar e insertar
                  minimum: 0
                  default: 0
              example:
                users: 10
                pets: 15
      responses:
        "200":
          description: Datos generados e insertados correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  users:
                    type: integer
                    description: Número de usuarios insertados
                  pets:
                    type: integer
                    description: Número de mascotas insertadas
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  error:
                    type: string